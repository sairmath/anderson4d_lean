[general]
renderer=HTML5
copy-theme-extras=yes
plugins=plastexdepgraph plastexshowmore leanblueprint
; TeX-less local builds: resolve \input paths via the repo shim
; (harmless on CI, where the same script exists in the checkout).
kpsewhich=../../scripts/kpsewhich

[document]
toc-depth=2
toc-non-files=True

[files]
directory=../web/
split-level=0

[html5]
localtoc-level=1
extra-css=extra_styles.css
mathjax-dollars=False
