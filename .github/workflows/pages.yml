name: Build and deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "requirements-docs.txt"
      - "scripts/check_pages_site.py"
      - "website/**"
      - "blueprint/**"
      - "Anderson4D/**"
      - "Anderson4D.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "requirements-docs.txt"
      - "scripts/check_pages_site.py"
      - "website/**"
      - "blueprint/**"
      - "Anderson4D/**"
      - "Anderson4D.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"

# Pull-request builds stay read-only. Deployment permissions are granted only
# to the trusted deployment job after the complete site build has passed.
permissions:
  contents: read

jobs:
  build_pages:
    name: Build landing page, blueprint, and API docs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: pages-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Check out project
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build Lean project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          lint: false
          mk_all-check: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install blueprint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz libgraphviz-dev pkg-config
          python -m pip install --disable-pip-version-check --requirement requirements-docs.txt

      - name: Build Lean blueprint web output
        run: |
          leanblueprint web
          mkdir -p site/blueprint
          cp -a blueprint/web/. site/blueprint/

      # API documentation is determined entirely by the pinned docgen builder
      # and Lean source tree.  Use an exact key only: a source change must
      # regenerate the documentation rather than restoring a near match.
      - name: Restore exact Lean API documentation cache
        id: docs-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: site/docs
          key: docs-${{ runner.os }}-docgen-deed0cdc44dd8e5de07a300773eb751d33e32fc8-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'Anderson4D.lean', 'Anderson4D/**/*.lean') }}

      # Invoke the pinned official builder directly so pull requests and
      # trusted deployments use the same API-documentation generation path.
      - name: Check out pinned docgen builder
        if: steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: leanprover-community/docgen-action
          ref: deed0cdc44dd8e5de07a300773eb751d33e32fc8
          path: .docgen-action
          fetch-depth: 1
          persist-credentials: false

      - name: Build Lean API documentation (build-page false)
        if: steps.docs-cache.outputs.cache-hit != 'true'
        env:
          NAME: anderson4d
          DOCS_FACETS: "Anderson4D:docs"
          HOMEPAGE: site
        run: bash .docgen-action/scripts/build_docs.sh

      - name: Stage landing page and verify site
        run: |
          install -m 0644 website/index.html site/index.html
          install -m 0644 website/styles.css site/styles.css
          install -m 0644 website/og.png site/og.png
          python scripts/check_pages_site.py site
          if grep -R -I -n -E '(/Users/|/home/runner/|BEGIN (RSA |OPENSSH )?PRIVATE KEY|github[_-]token)' site; then
            echo "Generated site contains a local path or credential-like text." >&2
            exit 1
          fi

      - name: Save exact Lean API documentation cache
        if: steps.docs-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: site/docs
          key: ${{ steps.docs-cache.outputs.cache-primary-key }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 7

  deploy_pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build_pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
